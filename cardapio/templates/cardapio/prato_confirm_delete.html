{% extends 'cardapio/base.html' %}
{% block title %}Excluir prato{% endblock %}
{% block content %}
<h1>Excluir prato</h1>
<div class="card">
    <p>Tem certeza que deseja excluir o prato <strong>{{ object.nome }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Excluir</button>
        <a class="btn btn-small" href="{% url 'prato_list' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
