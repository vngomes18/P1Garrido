{% extends 'cardapio/base.html' %}
{% block title %}Excluir mesa{% endblock %}
{% block content %}
<h1>Excluir mesa</h1>
<div class="card">
    <p>Tem certeza que deseja excluir a <strong>Mesa {{ object.numero }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="btn btn-danger" type="submit">Excluir</button>
        <a class="btn btn-small" href="{% url 'mesa_list' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
