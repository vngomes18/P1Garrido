{% extends 'cardapio/base.html' %}
{% block title %}Mesa{% endblock %}
{% block content %}
<h1>{% if object %}Editar mesa{% else %}Nova mesa{% endif %}</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Salvar</button>
        <a class="btn btn-small" href="{% url 'mesa_list' %}">Cancelar</a>
    </form>
</div>
{% endblock %}
