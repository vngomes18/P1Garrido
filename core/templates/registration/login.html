{% extends 'cardapio/base.html' %}
{% block title %}Entrar{% endblock %}
{% block content %}
<h1>Entrar</h1>
<div class="card" style="max-width: 420px;">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn" type="submit">Entrar</button>
    </form>
</div>
{% endblock %}
